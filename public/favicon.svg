<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="steamBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cupOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="saucerRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#27272a" stroke-width="1.5"/>

  <!-- Java Steaming Vapor (Iconic 3 Blue Curls) -->
  <!-- Left Vapor -->
  <path d="M25 13 C23 17, 27 21, 25 25 C24 27, 22 28, 20 29" stroke="url(#steamBlue)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Center Main Vapor -->
  <path d="M33 10 C29 15, 36 20, 32 25 C30 28, 27 29, 25 31" stroke="url(#steamBlue)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <!-- Right Vapor -->
  <path d="M39 14 C38 18, 43 21, 40 26 C38 28, 35 30, 32 31" stroke="url(#steamBlue)" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Java Cup Body -->
  <path d="M20 34 C20 44, 42 44, 42 34" stroke="url(#cupOrange)" stroke-width="3.2" stroke-linecap="round" fill="none"/>

  <!-- Cup Handle -->
  <path d="M42 35.5 C46.5 35.5, 47.5 41.5, 41.5 42.5" stroke="url(#cupOrange)" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- Cup Rim -->
  <path d="M20.5 34 C24 36.5, 38 36.5, 41.5 34" stroke="url(#cupOrange)" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Saucer Base Swoop -->
  <path d="M15 48.5 C23 53.5, 39 53.5, 47 48.5" stroke="url(#saucerRed)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <path d="M22 52.5 C26.5 54.5, 35.5 54.5, 40 52.5" stroke="url(#saucerRed)" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
