<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="favSteam" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="favRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="favSaucer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="favCode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Container Base Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Steaming Vapor Curves -->
  <path d="M23 26 C21 19, 27 15, 24 10 C23 9, 22 7.5, 20.5 6" stroke="url(#favSteam)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M32 25 C29.5 17.5, 37 13.5, 33 6.5 C32 4.8, 30.5 3.8, 29 3" stroke="url(#favSteam)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M40 26 C41 21, 36 17, 39 11.5" stroke="url(#favSteam)" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Cup Rim Halo -->
  <ellipse cx="32" cy="31" rx="18.5" ry="4.2" stroke="url(#favRim)" stroke-width="2.8" fill="none"/>

  <!-- Cup Main Body Envelope -->
  <path d="M16 33 C17 43, 23.5 49.5, 32 49.5 C40.5 49.5, 47 43, 48 33" stroke="url(#favRim)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Cup Handle -->
  <path d="M46 34.5 C52 35, 54.5 39.5, 51.5 44 C49.2 47.2, 45.5 46.8, 44 46" stroke="url(#favRim)" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Embedded Developer Code Symbol </ > inside Cup -->
  <g transform="translate(19.5, 36) scale(1.05)">
    <!-- Left angle < -->
    <path d="M7 3.5 L2 7.5 L7 11.5" stroke="url(#favCode)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slash / -->
    <path d="M14.5 3 L11 12" stroke="url(#favCode)" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Right angle > -->
    <path d="M18.5 3.5 L23.5 7.5 L18.5 11.5" stroke="url(#favCode)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Aerodynamic Saucer Base Curve -->
  <path d="M12 55 C20 60, 44 60, 52 55" stroke="url(#favSaucer)" stroke-width="3.4" stroke-linecap="round" fill="none"/>
</svg>
