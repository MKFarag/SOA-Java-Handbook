<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="330" rx="14" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Static Library vs. Shared Library (Packaging &amp; Deployment)</text>

  <!-- Static Library Panel -->
  <rect x="24" y="48" width="374" height="262" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="24" y="48" width="374" height="36" rx="10" fill="#334155"/>
  <text x="211" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Static Library (Copied Into Each App)</text>

  <rect x="46" y="102" width="150" height="128" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="121" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">App A (BAR)</text>
  <rect x="60" y="138" width="122" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="121" y="159" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">Flow A</text>
  <rect x="60" y="182" width="122" height="36" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="121" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">StaticLib (Copy 1)</text>

  <rect x="226" y="102" width="150" height="128" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="301" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">App B (BAR)</text>
  <rect x="240" y="138" width="122" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="301" y="159" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">Flow B</text>
  <rect x="240" y="182" width="122" height="36" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="301" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">StaticLib (Copy 2)</text>

  <text x="211" y="256" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">Each app owns a private copy.</text>
  <text x="211" y="276" text-anchor="middle" font-size="11.5" fill="#475569">Update StaticLib &#8594; Must rebuild &amp; redeploy BOTH apps.</text>

  <!-- Shared Library Panel -->
  <rect x="422" y="48" width="374" height="262" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="422" y="48" width="374" height="36" rx="10" fill="#0369a1"/>
  <text x="609" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Shared Library (One Live Shared Copy)</text>

  <rect x="444" y="102" width="144" height="72" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="516" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0c4a6e">App A</text>
  <text x="516" y="150" text-anchor="middle" font-size="11" fill="#0369a1">References SharedLib</text>

  <rect x="630" y="102" width="144" height="72" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="702" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0c4a6e">App B</text>
  <text x="702" y="150" text-anchor="middle" font-size="11" fill="#0369a1">References SharedLib</text>

  <rect x="492" y="196" width="234" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="609" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">SharedLib (Deployed Once)</text>

  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0369a1"/>
    </marker>
  </defs>
  <line x1="516" y1="174" x2="555" y2="195" stroke="#0369a1" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="702" y1="174" x2="663" y2="195" stroke="#0369a1" stroke-width="2" marker-end="url(#arr2)"/>

  <text x="609" y="264" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14532d">Deployed separately to Integration Server.</text>
  <text x="609" y="284" text-anchor="middle" font-size="11.5" fill="#166534">Update SharedLib &#8594; Apps get changes automatically!</text>
</svg>
