<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="240" rx="14" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Node Terminals Explained (Normal Path vs. Error Path)</text>
  <defs>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
  </defs>

  <!-- Node Card -->
  <rect x="275" y="64" width="210" height="114" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
  <text x="380" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Processing Node</text>
  <text x="380" y="136" text-anchor="middle" font-size="11.5" fill="#64748b">(e.g. MQInput / Compute)</text>

  <!-- Terminals -->
  <circle cx="275" cy="121" r="7" fill="#2563eb"/>
  <text x="258" y="114" text-anchor="end" font-size="12" font-weight="700" fill="#1d4ed8">in</text>
  <line x1="90" y1="121" x2="266" y2="121" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>
  <text x="45" y="125" font-size="12" font-weight="600" fill="#1e293b">Message</text>

  <circle cx="485" cy="92" r="7" fill="#dc2626"/>
  <text x="502" y="96" font-size="12" font-weight="700" fill="#dc2626">failure</text>
  <line x1="492" y1="92" x2="600" y2="68" stroke="#dc2626" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="610" y="72" font-size="12" font-weight="600" fill="#991b1b">Node itself failed</text>

  <circle cx="485" cy="121" r="7" fill="#16a34a"/>
  <text x="502" y="125" font-size="12" font-weight="700" fill="#16a34a">out</text>
  <line x1="492" y1="121" x2="600" y2="121" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="610" y="125" font-size="12" font-weight="600" fill="#14532d">Success! Next node</text>

  <circle cx="485" cy="152" r="7" fill="#d97706"/>
  <text x="502" y="156" font-size="12" font-weight="700" fill="#b45309">catch</text>
  <line x1="492" y1="152" x2="600" y2="178" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
  <text x="610" y="182" font-size="12" font-weight="600" fill="#92400e">Downstream node threw error</text>
</svg>
