<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="100%" height="auto" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="880" height="420" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="440" y="34" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">How IBM ACE Connects to Microsoft SQL Server (ODBC vs. JDBC)</text>
  <text x="440" y="55" text-anchor="middle" font-size="12.5" fill="#475569">Compute/Database/Filter use OS ODBC Data Sources; Mapping &amp; JavaCompute use JDBC Policies</text>

  <!-- Path 1: ODBC (Top Track) -->
  <rect x="28" y="80" width="824" height="150" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="44" y="92" width="180" height="24" rx="6" fill="#0284c7"/>
  <text x="134" y="108" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">PATH 1: ODBC (Most Common)</text>

  <!-- Node box -->
  <rect x="44" y="130" width="175" height="82" rx="9" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="131" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">Compute / Database</text>
  <text x="131" y="173" text-anchor="middle" font-size="11" fill="#334155">ESQL PASSTHRU / SELECT</text>
  <text x="131" y="195" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Data source = ORDERS_DB</text>

  <!-- Arrow 1 -->
  <line x1="219" y1="171" x2="255" y2="171" stroke="#0284c7" stroke-width="2.5"/>
  <polygon points="255,165 267,171 255,177" fill="#0284c7"/>

  <!-- Security parms box -->
  <rect x="268" y="130" width="185" height="82" rx="9" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="360" y="153" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0369a1">ACE Security Credentials</text>
  <text x="360" y="173" text-anchor="middle" font-size="11" fill="#0f172a">mqsisetdbparms</text>
  <text x="360" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">-n odbc::ORDERS_DB</text>

  <!-- Arrow 2 -->
  <line x1="453" y1="171" x2="489" y2="171" stroke="#0284c7" stroke-width="2.5"/>
  <polygon points="489,165 501,171 489,177" fill="#0284c7"/>

  <!-- OS Driver box -->
  <rect x="502" y="130" width="185" height="82" rx="9" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="594" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0369a1">64-bit ODBC Driver</text>
  <text x="594" y="171" text-anchor="middle" font-size="11" fill="#334155">Win: odbcad32.exe (System DSN)</text>
  <text x="594" y="190" text-anchor="middle" font-size="11" fill="#334155">Linux: odbc.ini (UKsqls95.so)</text>

  <!-- Arrow 3 to DB -->
  <line x1="687" y1="171" x2="723" y2="195" stroke="#0284c7" stroke-width="2.5"/>
  <polygon points="719,199 731,200 725,189" fill="#0284c7"/>

  <!-- Path 2: JDBC (Bottom Track) -->
  <rect x="28" y="246" width="668" height="148" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="44" y="258" width="190" height="24" rx="6" fill="#059669"/>
  <text x="139" y="274" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">PATH 2: JDBC Policy</text>

  <!-- Mapping / JavaCompute -->
  <rect x="44" y="296" width="175" height="82" rx="9" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="131" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Mapping / JavaCompute</text>
  <text x="131" y="339" text-anchor="middle" font-size="11" fill="#334155">Visual DB Select / Insert</text>
  <text x="131" y="359" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">getJDBCType4Connection()</text>

  <line x1="219" y1="337" x2="255" y2="337" stroke="#059669" stroke-width="2.5"/>
  <polygon points="255,331 267,337 255,343" fill="#059669"/>

  <!-- Policy box -->
  <rect x="268" y="296" width="185" height="82" rx="9" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="360" y="319" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">JDBCProviders Policy</text>
  <text x="360" y="339" text-anchor="middle" font-size="11" fill="#334155">mqsisetdbparms</text>
  <text x="360" y="358" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">-n jdbc::MySqlCreds</text>

  <line x1="453" y1="337" x2="489" y2="337" stroke="#059669" stroke-width="2.5"/>
  <polygon points="489,331 501,337 489,343" fill="#059669"/>

  <!-- JAR box -->
  <rect x="502" y="296" width="180" height="82" rx="9" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="592" y="319" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">Microsoft Type-4 JAR</text>
  <text x="592" y="339" text-anchor="middle" font-size="11" fill="#334155">mssql-jdbc-*.jar</text>
  <text x="592" y="358" text-anchor="middle" font-size="11" fill="#334155">SQLServerDriver</text>

  <line x1="682" y1="337" x2="723" y2="290" stroke="#059669" stroke-width="2.5"/>
  <polygon points="717,287 729,282 726,295" fill="#059669"/>

  <!-- Shared SQL Server Cylinder Target -->
  <rect x="726" y="162" width="128" height="164" rx="14" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <ellipse cx="790" cy="186" rx="48" ry="13" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="790" y="226" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">SQL Server</text>
  <text x="790" y="246" text-anchor="middle" font-size="11.5" fill="#cbd5e1">TCP/IP Port 1433</text>
  <text x="790" y="268" text-anchor="middle" font-size="11" fill="#38bdf8">Database: OrdersDb</text>
  <text x="790" y="290" text-anchor="middle" font-size="10.5" fill="#94a3b8">Test: mqsicvp -n DSN</text>
</svg>
