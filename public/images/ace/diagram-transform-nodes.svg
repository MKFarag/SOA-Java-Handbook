<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 265" width="820" height="265" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="265" rx="14" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Transformation Nodes: Mapping vs. Compute vs. JavaCompute</text>

  <rect x="26" y="52" width="242" height="190" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <rect x="26" y="52" width="242" height="36" rx="10" fill="#0f766e"/>
  <text x="147" y="75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Mapping Node (.map)</text>
  <text x="147" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Drag-and-Drop (No Code)</text>
  <text x="147" y="138" text-anchor="middle" font-size="11.5" fill="#475569">Use when you have schemas</text>
  <text x="147" y="156" text-anchor="middle" font-size="11.5" fill="#475569">(XSD / JSON Schema) and</text>
  <text x="147" y="174" text-anchor="middle" font-size="11.5" fill="#475569">want visual field mapping.</text>
  <text x="147" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">Best for: Clean visual data lineage</text>

  <rect x="289" y="52" width="242" height="190" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="289" y="52" width="242" height="36" rx="10" fill="#1d4ed8"/>
  <text x="410" y="75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Compute Node (ESQL)</text>
  <text x="410" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Fast ESQL Script</text>
  <text x="410" y="138" text-anchor="middle" font-size="11.5" fill="#475569">Use for custom loops, IFs,</text>
  <text x="410" y="156" text-anchor="middle" font-size="11.5" fill="#475569">dynamic JSON without schemas,</text>
  <text x="410" y="174" text-anchor="middle" font-size="11.5" fill="#475569">and top runtime speed.</text>
  <text x="410" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">Best for: 80% of ACE flows</text>

  <rect x="552" y="52" width="242" height="190" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="552" y="52" width="242" height="36" rx="10" fill="#4338ca"/>
  <text x="673" y="75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">JavaCompute Node (Java)</text>
  <text x="673" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Full Java Code</text>
  <text x="673" y="138" text-anchor="middle" font-size="11.5" fill="#475569">Use when you need external</text>
  <text x="673" y="156" text-anchor="middle" font-size="11.5" fill="#475569">Java JARs, regex, encryption,</text>
  <text x="673" y="174" text-anchor="middle" font-size="11.5" fill="#475569">or Java team skills.</text>
  <text x="673" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#4338ca">Best for: Java libraries &amp; complex math</text>
</svg>
